<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picalex HQ — Photo Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HERO ============ -->
<section id="hero">
  <div class="hero-in">
    <h1>Picalex <span>HQ</span></h1>
    <p class="tag">Studio-grade filters, effects, frames &amp; collage — sized perfectly for every social platform.</p>
    <label class="dropzone" for="file">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
      <b>Tap to choose a photo</b>
      <small>or drag &amp; drop anywhere · JPG / PNG / WEBP</small>
    </label>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <button id="goCollage" class="btn ghost">🧩 Collage maker</button>
  </div>
</section>

<!-- ============ EDITOR ============ -->
<main id="editor" hidden>
  <header class="bar">
    <button id="change" class="btn small">← Change</button>
    <button id="toCollage" class="btn small ghost">🧩 Collage</button>
    <button id="dl" class="btn small primary">Export ⬇</button>
  </header>

  <section id="stage">
    <canvas id="cBefore"></canvas>
    <canvas id="cAfter"></canvas>
    <div id="handle"></div>
    <div id="dims" class="pill"></div>
    <p id="note"></p>
  </section>

  <nav id="tabs">
    <button data-tab="result" class="on">Result</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="move" id="tabMove" hidden>Reposition</button>
  </nav>

  <section class="group">
    <h2>Format</h2>
    <div id="platforms" class="cards"></div>
    <div id="cropBlk" class="rowline">
      <div class="seg" data-key="crop">
        <button data-v="cover" class="on">Fill</button>
        <button data-v="fit">Fit</button>
      </div>
      <span id="cropHint" class="hint"></span>
    </div>
  </section>

  <section class="group">
    <h2>Frame</h2>
    <div id="frames" class="cards"></div>
    <div id="capRow" class="rowline" hidden>
      <input id="caption" type="text" maxlength="60" placeholder="Write a caption… (Polaroid style)">
    </div>
  </section>

  <section class="group">
    <h2>Filters</h2>
    <div id="filters" class="chips"></div>
  </section>

  <section class="group">
    <h2>Effects</h2>
    <div id="effects" class="chips"></div>
    <button id="fxMore" class="btn link">Show all effects</button>
  </section>

  <section class="group">
    <div id="rowStrength"></div>
    <div id="rowFx" hidden></div>
    <h2>Adjust</h2>
    <div id="sliders"></div>
    <h2>Pro tools</h2>
    <div id="sliders2"></div>
    <button id="resetAdj" class="btn link">Reset all adjustments</button>
  </section>

  <section class="group">
    <h2>Export</h2>
    <div class="seg" data-key="fmt">
      <button data-v="jpg" class="on">JPG</button>
      <button data-v="webp">WEBP</button>
      <button data-v="png">PNG</button>
    </div>
    <div class="seg q" data-key="quality">
      <button data-v="standard">Standard</button>
      <button data-v="high" class="on">High</button>
      <button data-v="ultra">Ultra</button>
    </div>
    <p id="qHint" class="hint"></p>
  </section>
</main>

<!-- ============ COLLAGE ============ -->
<section id="collage" hidden>
  <header class="bar">
    <button id="cBack" class="btn small">← Back</button>
    <span class="spacer"></span>
    <button id="cAdd" class="btn small ghost">＋ Photos</button>
    <button id="cClear" class="btn small ghost">Clear</button>
    <button id="cGo" class="btn small primary">Use →</button>
  </header>

  <div id="cStage"><canvas id="cCol"></canvas></div>
  <p class="hint center"><span id="cDims"></span> · tap a tile to replace it</p>

  <section class="group">
    <h2>Layout</h2>
    <div id="layouts" class="lchips"></div>
    <div class="seg" id="cAr">
      <button data-v="1:1">1:1</button>
      <button data-v="4:5" class="on">4:5</button>
      <button data-v="9:16">9:16</button>
    </div>
    <div class="rowline">
      <label>Gap <output id="oGap">14</output></label>
      <input id="cGap" type="range" min="0" max="60" value="14">
    </div>
    <div class="rowline">
      <label>Radius <output id="oRad">16</output></label>
      <input id="cRad" type="range" min="0" max="80" value="16">
    </div>
    <h2>Background</h2>
    <div id="swatches"></div>
  </section>
  <input id="fileCol" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
</section>

<input id="file2" type="file" accept="image/jpeg,image/png,image/webp" hidden>

<div id="toast" role="status"></div>
<div id="busy" hidden><div class="spin"></div><p id="busyTxt"></p></div>
<div id="drop"><b>Drop to start editing</b></div>

<div id="sheet" hidden>
  <div class="sheet-in">
    <img id="sheetImg" alt="Exported photo">
    <p class="hint">Long-press the image to save it to your gallery.</p>
    <button id="sheetShare" class="btn primary" hidden>Share</button>
    <button id="sheetClose" class="btn ghost">Close</button>
  </div>
</div>

<script src="script.js"></script>
<script src="extras.js"></script>
</body>
</html>
